<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GARGANTUA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 100% at 50% 0%,#101820 0%,#05070a 60%,#000 100%);
       font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#d7e6ee;padding:24px}
  .card{max-width:600px;width:100%;background:rgba(10,16,22,.92);border:1px solid #1d3a47;border-radius:14px;
        padding:28px 30px;box-shadow:0 0 60px rgba(0,180,255,.08)}
  h1{margin:0;font-size:24px;letter-spacing:.06em;color:#7fdcff}
  .tag{margin:2px 0 8px;color:#8fa8b5;font-size:14.5px}
  .verdict{display:inline-block;margin:10px 0 2px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em}
  .v-ok{background:#0d2a1c;color:#5ce690;border:1px solid #1d5c38}
  .v-note{background:#33230a;color:#ffb454;border:1px solid #6b4a14}
  .v-gl{background:#33110d;color:#ff7a6b;border:1px solid #6b2a20}
  p{margin:10px 0}
  .sub{color:#8fa8b5;font-size:14px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  a.btn{flex:1 1 180px;text-align:center;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid transparent}
  .b-go{background:#123a52;color:#7fdcff;border-color:#1d5c7a}
  .b-go:hover{background:#174a68}
  .b-doc{background:#151a1f;color:#9fb4bf;border-color:#2a3640}
  .b-doc:hover{background:#1c242c}
  .count{margin-top:14px;font-size:14px;color:#8fa8b5}
  .count b{color:#7fdcff}
  code{background:#0c1218;border:1px solid #1d2a33;border-radius:5px;padding:1px 6px;font-size:13px;color:#9fd8ee}
  .foot{margin-top:16px;font-size:12.5px;color:#5f7683}
</style>
</head>
<body>
<div class="card" role="dialog" aria-labelledby="ttl">
  <h1 id="ttl">GARGANTUA</h1>
  <p class="tag">A real-time Kerr black-hole renderer, running entirely in your browser.</p>
  <span class="verdict v-ok" id="badgeOk" hidden>READY</span>
  <span class="verdict v-note" id="badgeNote" hidden>NOTE</span>
  <span class="verdict v-gl" id="badgeGl" hidden>WEBGL UNAVAILABLE</span>
  <div id="msg" aria-live="polite"></div>
  <div class="btns" id="btns" hidden>
    <a class="b-go"  id="bEnter" href="GARGANTUA.html">▶ Enter the engine</a>
    <a class="b-doc" id="bDoc" href="docs/WARNINGS.md">📄 Performance notes</a>
  </div>
  <div class="count" id="count"></div>
  <p class="foot">This quick check runs locally in your browser — nothing is uploaded.
     Skip it any time: append <code>?skip</code> to this URL, or open <code>GARGANTUA.html</code> directly.</p>
</div>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  if (qs.has("skip")) { location.replace("GARGANTUA.html" + location.hash); return; }
  try { if (sessionStorage.getItem("garg_gate_ack") === "1") { location.replace("GARGANTUA.html" + location.hash); return; } } catch(e){}

  var msg = document.getElementById("msg");
  var btns = document.getElementById("btns");
  var countEl = document.getElementById("count");
  var bEnter = document.getElementById("bEnter");
  var badges = { ok:document.getElementById("badgeOk"), note:document.getElementById("badgeNote"), gl:document.getElementById("badgeGl") };

  function show(v){ badges[v].hidden = false; btns.hidden = false; }
  function go(){ try{ sessionStorage.setItem("garg_gate_ack","1"); }catch(e){} location.href = "GARGANTUA.html"; }
  bEnter.addEventListener("click", function(e){ e.preventDefault(); go(); });

  function gpuInfo(){
    try{
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl2") || c.getContext("webgl");
      if(!gl) return { ok:false };
      var e = gl.getExtension("WEBGL_debug_renderer_info");
      var r = e ? String(gl.getParameter(e.UNMASKED_RENDERER_WEBGL)) : "";
      return { ok:true, soft:/swiftshader|llvmpipe|softpipe|software|basic render/i.test(r) };
    }catch(err){ return { ok:true, soft:false }; }
  }

  function isMobile(){
    var ua = navigator.userAgent || "";
    if (/Android|iPhone|iPad|iPod|Mobile|Silk/i.test(ua)) return true;
    return (navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width, screen.height) <= 820;
  }

  var g = gpuInfo();
  var html = "";

  /* 1) No WebGL — the engine cannot create a 3D context at all */
  if (!g.ok){
    show("gl");
    html += "<p><b>Your browser does not support WebGL.</b> The engine needs WebGL — the standard " +
            "3D graphics API built into every modern browser.</p>" +
            "<p class='sub'>Try enabling hardware acceleration in your browser settings, updating your browser " +
            "or GPU driver, then reloading this page.</p>";
    bEnter.parentNode.removeChild(bEnter);
    msg.innerHTML = html; return;
  }

  /* 2) Software rendering — WebGL works, but without the graphics card */
  if (g.soft){
    show("note");
    html += "<p><b>Heads-up:</b> your browser appears to be using <b>software rendering</b> instead of your " +
            "graphics card. This is common in virtual machines, remote desktops, or when hardware " +
            "acceleration is switched off.</p>" +
            "<p class='sub'>The engine will still start, but 3D content usually runs slowly this way. " +
            "Enabling hardware acceleration in the browser settings typically fixes it.</p>";
    msg.innerHTML = html; return;
  }

  /* 3) Phone / tablet — one friendly line, nothing more */
  if (isMobile()){
    show("note");
    html += "<p><b>Heads-up:</b> you're on a phone or tablet. The engine runs in mobile browsers too — " +
            "if the frame rate feels low, simply pick a lower quality tier in the engine's settings.</p>";
    msg.innerHTML = html; return;
  }

  /* 4) All good — straight in */
  show("ok");
  html += "<p class='sub'>WebGL is ready. Starting the engine…</p>";
  msg.innerHTML = html;
  var n = 3;
  countEl.innerHTML = "Entering in <b id='cn'>" + n + "</b>s — or click Enter now.";
  var t = setInterval(function(){
    n--;
    var el = document.getElementById("cn");
    if (el) el.textContent = n;
    if (n <= 0){ clearInterval(t); go(); }
  }, 1000);
})();
</script>
</body>
</html>
